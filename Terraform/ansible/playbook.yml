---
# 1. Comum a todos: monta o EFS (bastion, app, db)

- name: Montar EFS em todas as instâncias
  hosts: db
  become: true

  tasks:
    - name: Instalar cliente NFS
      apt:
        name: nfs-common
        state: present
        update_cache: true

    - name: Criar diretorio de montagem
      file:
        path: /mnt/efs
        state: directory

    - name: Montar EFS e persistir no fstab
      mount:
        path: /mnt/efs
        src: "{{ efs_dns_name }}:/"
        fstype: nfs4
        opts: nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport
        state: mounted

# 2. Somente instâncias "app": Docker

- name: Instalar Docker nas instâncias de aplicação
  hosts: app
  become: true

  tasks:
    - name: Instalar dependências
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Criar diretorio para chave GPG
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Adicionar chave GPG do Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Adicionar repositório do Docker
      apt_repository:
        repo: "deb [arch={{ ansible_architecture | replace('x86_64','amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Instalar Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Garantir que o Docker está rodando
      service:
        name: docker
        state: started
        enabled: true

    - name: Adicionar usuario ao grupo docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true


# 3. Somente instância "db": MySQL

- name: Instalar MySQL na instância de banco
  hosts: db
  become: true
  vars:
    mysql_root_password: "{{ vault_mysql_root_password | default('CHANGE_ME') }}"
    mysql_app_db: "app_db"
    mysql_app_user: "app_user"
    mysql_app_password: "{{ vault_mysql_app_password | default('CHANGE_ME') }}"

  tasks:
    - name: Instalar MySQL Server
      apt:
        name: mysql-server
        state: present
        update_cache: true

    - name: Instalar dependência Python para o modulo mysql
      apt:
        name: python3-pymysql
        state: present

    - name: Garantir que o MySQL está rodando
      service:
        name: mysql
        state: started
        enabled: true

    - name: Definir senha do root (idempotente via socket local)
      community.mysql.mysql_user:
        name: root
        password: "{{ mysql_root_password }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
        check_implicit_admin: true

    - name: Criar banco da aplicação
      community.mysql.mysql_db:
        name: "{{ mysql_app_db }}"
        state: present
        login_user: root
        login_password: "{{ mysql_root_password }}"

    - name: Criar usuário da aplicação
      community.mysql.mysql_user:
        name: "{{ mysql_app_user }}"
        password: "{{ mysql_app_password }}"
        priv: "{{ mysql_app_db }}.*:ALL"
        host: "%"
        state: present
        login_user: root
        login_password: "{{ mysql_root_password }}"
