# =====================================================================
#  Fluent Bit - Boost Your English (Grupo 4)
#  Captura: containers Docker (backend, frontend/nginx, mysql),
#           nginx instalado no host (se existir) e logs do SO (journald)
#  Destino: bucket S3 bronze, prefixo logs/
# =====================================================================

# Variáveis por máquina (NODE_NAME, NODE_ROLE, BRONZE_BUCKET, AWS_REGION, AMBIENTE)
@INCLUDE /etc/fluent-bit/boost-env.conf

[SERVICE]
    Flush                     5
    Log_Level                 info
    Daemon                    off
    Parsers_File              /etc/fluent-bit/parsers-boost.conf
    HTTP_Server               On
    HTTP_Listen               127.0.0.1
    HTTP_Port                 2020
    Health_Check              On
    storage.path              /var/lib/fluent-bit/storage
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 16M

# ---------------------------------------------------------------------
#  ENTRADAS
# ---------------------------------------------------------------------

# 1) Containers: o Docker envia os logs via log-driver "fluentd"
#    (ver docker-daemon.json). Tag recebida: docker.<nome_do_container>
[INPUT]
    Name              forward
    Listen            127.0.0.1
    Port              24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   6M
    storage.type      filesystem

# 2) Nginx instalado direto no host (se não existir, a entrada fica ociosa).
#    O nginx do front roda dentro do container frontend-g4 e já chega pela entrada 1.
[INPUT]
    Name              tail
    Tag               hostlog.nginx
    Path              /var/log/nginx/access.log,/var/log/nginx/error.log
    Path_Key          arquivo_origem
    DB                /var/lib/fluent-bit/tail-nginx.db
    Read_from_Head    Off
    Skip_Long_Lines   On
    Refresh_Interval  10
    storage.type      filesystem

# 3) Sistema operacional: journald (syslog, auth/sshd/sudo, kernel, docker.service...)
[INPUT]
    Name              systemd
    Tag               journal
    DB                /var/lib/fluent-bit/journald.db
    Read_From_Tail    On
    Strip_Underscores On
    Lowercase         On
    storage.type      filesystem

# ---------------------------------------------------------------------
#  FILTROS - containers e nginx
# ---------------------------------------------------------------------

# Normaliza nome do container, descobre o serviço e identifica linhas de nginx
[FILTER]
    Name    lua
    Match_Regex ^(docker|hostlog)\.
    script  /etc/fluent-bit/boost.lua
    call    classificar_container

# Roteia: nginx -> nginx.access / nginx.error ; demais -> app.<servico>
# (a primeira regra que casar é aplicada)
[FILTER]
    Name         rewrite_tag
    Match_Regex  ^(docker|hostlog)\.
    Rule         $tipo_log  ^nginx_access$  nginx.access  false
    Rule         $tipo_log  ^nginx_error$   nginx.error   false
    Rule         $servico   ^(.+)$          app.$1        false
    Emitter_Name reroute_containers
    Emitter_Storage.type filesystem

# Junta stack traces do Java (Spring Boot) em um único evento
[FILTER]
    Name                  multiline
    Match                 app.backend
    multiline.key_content log
    multiline.parser      java_spring
    buffer                On
    flush_ms              2000
    emitter_name          ml_backend

# Spring Boot: extrai nível, thread, logger e mensagem (mantém a linha original em "log")
[FILTER]
    Name         parser
    Match        app.backend
    Key_Name     log
    Parser       spring_boot
    Reserve_Data On
    Preserve_Key On

[FILTER]
    Name         parser
    Match        nginx.access
    Key_Name     log
    Parser       nginx_access_boost
    Reserve_Data On
    Preserve_Key On

[FILTER]
    Name         parser
    Match        nginx.error
    Key_Name     log
    Parser       nginx_error_boost
    Reserve_Data On
    Preserve_Key On

# ---------------------------------------------------------------------
#  FILTROS - sistema operacional
# ---------------------------------------------------------------------

# Não reenvia os próprios logs do Fluent Bit (evita laço de erros)
[FILTER]
    Name    grep
    Match   journal
    Exclude systemd_unit ^fluent-bit\.service$

# Mantém só os campos úteis do journald
[FILTER]
    Name          record_modifier
    Match         journal
    Allowlist_key message
    Allowlist_key priority
    Allowlist_key systemd_unit
    Allowlist_key syslog_identifier
    Allowlist_key pid
    Allowlist_key transport
    Allowlist_key hostname

[FILTER]
    Name    lua
    Match   journal
    script  /etc/fluent-bit/boost.lua
    call    classificar_sistema

# sistema.auth | sistema.kernel | sistema.geral
[FILTER]
    Name         rewrite_tag
    Match        journal
    Rule         $categoria ^(.+)$ sistema.$1 false
    Emitter_Name reroute_sistema
    Emitter_Storage.type filesystem

# ---------------------------------------------------------------------
#  Metadados comuns a todos os eventos
# ---------------------------------------------------------------------
[FILTER]
    Name   record_modifier
    Match_Regex ^(app|nginx|sistema)\.
    Record node     ${NODE_NAME}
    Record role     ${NODE_ROLE}
    Record ambiente ${AMBIENTE}

# ---------------------------------------------------------------------
#  SAÍDAS - bucket bronze (JSON Lines + gzip, partições estilo Hive em UTC)
# ---------------------------------------------------------------------

# logs/containers/servico=<backend|frontend|mysql|outros>/ano=/mes=/dia=/hora=/
[OUTPUT]
    Name                         s3
    Alias                        s3_containers
    Match                        app.*
    bucket                       ${BRONZE_BUCKET}
    region                       ${AWS_REGION}
    use_put_object               On
    compression                  gzip
    total_file_size              50M
    upload_timeout               5m
    store_dir                    /var/lib/fluent-bit/s3
    store_dir_limit_size         512M
    s3_key_format                /logs/containers/servico=$TAG[1]/ano=%Y/mes=%m/dia=%d/hora=%H/${NODE_NAME}_%Y%m%dT%H%M%S_$UUID.json.gz
    s3_key_format_tag_delimiters .
    json_date_key                timestamp
    json_date_format             iso8601
    Retry_Limit                  10

# logs/nginx/tipo=<access|error>/ano=/mes=/dia=/hora=/
[OUTPUT]
    Name                         s3
    Alias                        s3_nginx
    Match                        nginx.*
    bucket                       ${BRONZE_BUCKET}
    region                       ${AWS_REGION}
    use_put_object               On
    compression                  gzip
    total_file_size              50M
    upload_timeout               5m
    store_dir                    /var/lib/fluent-bit/s3
    store_dir_limit_size         512M
    s3_key_format                /logs/nginx/tipo=$TAG[1]/ano=%Y/mes=%m/dia=%d/hora=%H/${NODE_NAME}_%Y%m%dT%H%M%S_$UUID.json.gz
    s3_key_format_tag_delimiters .
    json_date_key                timestamp
    json_date_format             iso8601
    Retry_Limit                  10

# logs/sistema/categoria=<auth|kernel|geral>/ano=/mes=/dia=/hora=/
[OUTPUT]
    Name                         s3
    Alias                        s3_sistema
    Match                        sistema.*
    bucket                       ${BRONZE_BUCKET}
    region                       ${AWS_REGION}
    use_put_object               On
    compression                  gzip
    total_file_size              50M
    upload_timeout               5m
    store_dir                    /var/lib/fluent-bit/s3
    store_dir_limit_size         512M
    s3_key_format                /logs/sistema/categoria=$TAG[1]/ano=%Y/mes=%m/dia=%d/hora=%H/${NODE_NAME}_%Y%m%dT%H%M%S_$UUID.json.gz
    s3_key_format_tag_delimiters .
    json_date_key                timestamp
    json_date_format             iso8601
    Retry_Limit                  10
