apiVersion: 1

datasources:
  - name: MySQL-Escola
    type: mysql
    uid: mysql-escola-uid
    access: proxy
    url: host.docker.internal:3306
    database: boost
    user: $__env{GRAFANA_DB_USER}
    secureJsonData:
      password: $__env{GRAFANA_DB_PASSWORD}
    isDefault: false
    jsonData:
      sslmode: "disable"
    editable: true
